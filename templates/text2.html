<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECL Certificate Validation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      padding: 40px 18px 60px;
      max-width: 430px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      color: #1b2f5e;
      text-transform: uppercase;
      line-height: 1.2;
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }

    .badge {
      display: block;
      background: #2ecc52;
      color: #ffffff;
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }

    .info {
      border: 1.5px solid #c5cad4;
      border-radius: 16px;
      padding: 4px 18px 8px;
    }

    .row {
      display: flex;
      align-items: flex-start;
      padding: 10px 0;
    }

    .lbl {
      flex: 0 0 40%;
      font-size: 20px;
      font-weight: 400;
      color: #111;
      line-height: 1.35;
    }

    .val {
      flex: 1;
      font-size: 20px;
      font-weight: 400;
      color: #111;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <h1>ECL Language Examination<br>Validation</h1>

  <span class="badge">This certificate is valid.</span>

  <div class="info">
    <div class="row"><span class="lbl">Name:</span><span class="val">Turgunaliev Okhunjon Okiljon Ugli</span></div>
    <div class="row"><span class="lbl">Language:</span><span class="val">German</span></div>
    <div class="row"><span class="lbl">Level:</span><span class="val">B2</span></div>
    <div class="row"><span class="lbl">Type:</span><span class="val">Complex</span></div>
    <div class="row"><span class="lbl">Centre<br>No:</span><span class="val">UZ-9970125</span></div>
    <div class="row"><span class="lbl">Date:</span><span class="val">08.02.2025</span></div>
  </div>

</body>
</html>
